<div id="chat-images-simple-preview">
<style>
#chat-images-simple-preview{--p-bg:light-dark(#fff,#20252d);--p-side:light-dark(#f4f5f8,#252c36);--p-text:light-dark(#303747,#e5eaf3);--p-muted:light-dark(#7c8598,#a7b1c3);--p-line:light-dark(#e8ebf0,#39414f);--p-accent:light-dark(#6372ba,#adbbf3);--p-selected:light-dark(#e9edf8,#35405a);--p-subtle:light-dark(#f8f9fc,#282f3b);--p-button:light-dark(#6272b8,#a6b5f2);--p-on:light-dark(#fff,#222c45);font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:var(--p-text);--thumb:96px}
#chat-images-simple-preview *{box-sizing:border-box}
#chat-images-simple-preview [hidden]{display:none!important}
#chat-images-simple-preview .p-window{display:grid;grid-template-columns:152px minmax(0,1fr);min-height:700px;background:var(--p-bg);border:1px solid var(--p-line);border-radius:18px;overflow:hidden}
#chat-images-simple-preview .p-side{background:var(--p-side);padding:28px 16px;display:flex;flex-direction:column;gap:34px}
#chat-images-simple-preview .p-brand{font-size:20px;font-weight:500;padding-left:13px}
#chat-images-simple-preview nav{display:grid;gap:9px}
#chat-images-simple-preview .p-nav{display:flex;align-items:center;gap:12px;padding:11px 13px;color:var(--p-muted);border-radius:10px}
#chat-images-simple-preview .p-nav svg{width:18px;height:18px;flex-shrink:0}
#chat-images-simple-preview .p-nav-active{color:var(--p-accent);background:var(--p-selected)}
#chat-images-simple-preview .p-side-bottom{margin-top:auto}
#chat-images-simple-preview .p-main{display:flex;flex-direction:column;min-width:0}
#chat-images-simple-preview .p-header{padding:24px 30px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--p-line)}
#chat-images-simple-preview h2,#chat-images-simple-preview h3,#chat-images-simple-preview p{margin:0}
#chat-images-simple-preview h2{font-size:20px;font-weight:500;line-height:1.4}
#chat-images-simple-preview h3{font-size:14px;font-weight:500}
#chat-images-simple-preview button{font:inherit;background:var(--p-bg);color:var(--p-text);border:1px solid var(--p-line);border-radius:9px;padding:7px 13px;cursor:default;white-space:nowrap}
#chat-images-simple-preview button:hover{background:var(--p-selected)}
#chat-images-simple-preview button:disabled{opacity:.4}
#chat-images-simple-preview .p-quiet{border:0;background:transparent;color:var(--p-muted)}
#chat-images-simple-preview .p-primary{background:var(--p-button);border-color:transparent;color:var(--p-on)}
#chat-images-simple-preview .p-primary:hover{background:var(--p-button);filter:brightness(.96)}
#chat-images-simple-preview .p-icon{display:flex;align-items:center;justify-content:center;width:34px;height:34px;padding:6px}
#chat-images-simple-preview .p-content{width:100%;max-width:730px;align-self:center;padding:28px 30px 18px;min-height:310px;display:grid;align-content:start;gap:24px;flex:1}
#chat-images-simple-preview .p-assistant{display:grid;gap:14px;align-content:start}
#chat-images-simple-preview .p-assistant-name{color:var(--p-muted);font-size:12px;display:flex;align-items:center;gap:7px}
#chat-images-simple-preview .p-assistant-name svg{width:14px;height:14px;color:var(--p-accent)}
#chat-images-simple-preview .p-intro{padding-top:24px}
#chat-images-simple-preview .p-tasklist{display:grid;gap:0;margin:0;padding:0;list-style:none}
#chat-images-simple-preview .p-task{padding:12px 0;border-bottom:1px solid var(--p-line);display:grid;grid-template-columns:24px minmax(0,1fr);gap:7px;align-items:start}
#chat-images-simple-preview .p-index{color:var(--p-muted)}
#chat-images-simple-preview .p-task p{color:var(--p-muted);font-size:12px;margin-top:3px}
#chat-images-simple-preview .p-review-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
#chat-images-simple-preview .p-user{justify-self:end;max-width:85%;background:var(--p-subtle);border-radius:14px 14px 4px 14px;padding:13px;overflow-wrap:anywhere;display:grid;gap:10px}
#chat-images-simple-preview .p-sent-images{display:flex;gap:8px;flex-wrap:wrap}
#chat-images-simple-preview .p-sent-images .p-picture{width:66px;height:76px;padding:8px;min-height:0}
#chat-images-simple-preview .p-composer-wrap{width:100%;max-width:730px;align-self:center;padding:0 30px 22px}
#chat-images-simple-preview .p-composer{border:1px solid var(--p-line);border-radius:16px;background:var(--p-bg);padding:16px;transition:background .15s ease}
#chat-images-simple-preview .p-composer.p-drag{background:var(--p-selected);border-color:var(--p-accent)}
#chat-images-simple-preview .p-images{display:flex;flex-wrap:wrap;gap:14px;justify-content:flex-start;align-items:flex-start;margin-bottom:14px}
#chat-images-simple-preview .p-attachment{width:var(--thumb);position:relative;min-width:0}
#chat-images-simple-preview .p-picture{width:100%;height:112px;background:var(--p-subtle);border:1px solid var(--p-line);border-radius:9px;padding:13px 12px;display:flex;flex-direction:column;justify-content:center;gap:7px;overflow:hidden}
#chat-images-simple-preview .p-picture img{width:100%;height:100%;object-fit:contain}
#chat-images-simple-preview .p-document-line{display:block;height:3px;border-radius:2px;background:var(--p-muted);opacity:.3;width:100%}
#chat-images-simple-preview .p-document-line:first-child{width:65%;opacity:.65;margin-bottom:7px}
#chat-images-simple-preview .p-document-line:nth-child(3n){width:75%}
#chat-images-simple-preview .p-document-line:nth-child(4n){width:88%;margin-bottom:7px}
#chat-images-simple-preview .p-remove{position:absolute;right:4px;top:4px;border-radius:50%;padding:3px;width:25px;height:25px;display:flex;align-items:center;justify-content:center;background:var(--p-bg)}
#chat-images-simple-preview .p-remove svg{width:12px;height:12px}
#chat-images-simple-preview .p-filename{font-size:12px;color:var(--p-muted);margin-top:6px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chat-images-simple-preview .p-add{width:var(--thumb);height:112px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:transparent;border-style:dashed;color:var(--p-muted);font-size:12px}
#chat-images-simple-preview .p-add svg{width:20px;height:20px}
#chat-images-simple-preview textarea{font:inherit;display:block;width:100%;min-width:0;min-height:55px;resize:vertical;border:0;background:transparent;color:var(--p-text);padding:0}
#chat-images-simple-preview textarea::placeholder{color:var(--p-muted)}
#chat-images-simple-preview .p-composer-bottom{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px}
#chat-images-simple-preview .p-composer-tools{display:flex;align-items:center;gap:8px;min-width:0;color:var(--p-muted);font-size:12px}
#chat-images-simple-preview .p-submit{display:flex;gap:7px;align-items:center}
#chat-images-simple-preview .p-submit svg{width:15px;height:15px}
#chat-images-simple-preview .p-disclosure{color:var(--p-muted);font-size:11px;margin-top:9px;text-align:center}
#chat-images-simple-preview .p-error{color:light-dark(#a43e43,#f8b4b6);font-size:12px;margin-bottom:10px}
#chat-images-simple-preview .p-saved{display:flex;gap:9px;align-items:center;color:var(--p-accent)}
#chat-images-simple-preview .p-saved svg{width:18px;height:18px}
@media(max-width:650px){#chat-images-simple-preview .p-window{grid-template-columns:58px minmax(0,1fr)}#chat-images-simple-preview .p-side{padding:23px 8px;gap:26px}#chat-images-simple-preview .p-brand{font-size:14px;padding:0;text-align:center}#chat-images-simple-preview .p-nav{padding:11px;justify-content:center}#chat-images-simple-preview .p-nav span{display:none}#chat-images-simple-preview .p-header{padding:21px 18px}#chat-images-simple-preview .p-content{padding:23px 18px 18px}#chat-images-simple-preview .p-composer-wrap{padding:0 18px 18px}#chat-images-simple-preview .p-composer{padding:12px}#chat-images-simple-preview .p-content{min-height:270px}#chat-images-simple-preview .p-images{gap:10px}#chat-images-simple-preview .p-disclosure{text-align:left}}
@media(max-width:400px){#chat-images-simple-preview{--thumb:72px}#chat-images-simple-preview .p-window{grid-template-columns:46px minmax(0,1fr)}#chat-images-simple-preview .p-side{padding:21px 4px}#chat-images-simple-preview .p-nav{padding:10px 8px}#chat-images-simple-preview .p-header{padding:18px 12px}#chat-images-simple-preview .p-content{padding:20px 12px 15px}#chat-images-simple-preview .p-composer-wrap{padding:0 12px 16px}#chat-images-simple-preview .p-picture,#chat-images-simple-preview .p-add{height:90px}#chat-images-simple-preview .p-count{display:none}#chat-images-simple-preview .p-user{max-width:100%}#chat-images-simple-preview .p-review-actions button{padding:7px 10px;font-size:12px}}
@media(pointer:coarse){#chat-images-simple-preview textarea{font-size:16px}#chat-images-simple-preview button{min-height:44px}#chat-images-simple-preview .p-remove{width:32px;height:32px;min-height:32px;right:0;top:0}#chat-images-simple-preview .p-remove svg{width:16px;height:16px}}
</style>
<div class="p-window" aria-label="课间助手多图对话预览">
<aside class="p-side"><div class="p-brand">课间<span style="color:var(--p-accent)"> ·</span></div><nav aria-label="主导航"><div class="p-nav"><i data-lucide="sun" aria-hidden="true"></i><span>今日</span></div><div class="p-nav"><i data-lucide="calendar-days" aria-hidden="true"></i><span>日程</span></div><div class="p-nav"><i data-lucide="check-square" aria-hidden="true"></i><span>任务</span></div><div class="p-nav p-nav-active" aria-current="page"><i data-lucide="message-circle" aria-hidden="true"></i><span>助手</span></div></nav><div class="p-side-bottom"><div class="p-nav"><i data-lucide="settings" aria-hidden="true"></i><span>设置</span></div></div></aside>
<main class="p-main"><header class="p-header"><h2>助手</h2><button class="p-quiet" type="button" data-reset>新会话</button></header><div class="p-content" data-messages aria-live="polite"></div><div class="p-composer-wrap"><div class="p-composer" data-drop><div class="p-images" data-images></div><p class="p-error" data-error hidden role="alert"></p><textarea aria-label="给助手的消息" placeholder="说说你想安排什么" data-input></textarea><div class="p-composer-bottom"><div class="p-composer-tools"><button type="button" class="p-icon p-quiet" aria-label="添加图片" data-attach><i data-lucide="paperclip" aria-hidden="true"></i></button><span class="p-count" data-count></span></div><button class="p-primary p-submit" type="button" data-send>发送<i data-lucide="arrow-up" aria-hidden="true"></i></button></div><input type="file" accept="image/png,image/jpeg,image/webp" multiple data-files hidden></div><p class="p-disclosure" data-disclosure>发送图片将交由已配置的模型识别</p></div></main>
</div>
<script>
(()=>{
 const root=document.getElementById('chat-images-simple-preview');
 const state={images:[{id:'sample-math',name:'高数作业.png'},{id:'sample-english',name:'英语听力.png'}],sent:[],phase:'ready',note:'',deadlines:['未填写截止日期','未填写截止日期'],skipped:false};
 const saved=window.openai?.widgetState?.modelContent;
 if(saved?.design==='聊天输入区多图上传'&&['ready','review','saved'].includes(saved?.phase)){state.phase=saved.phase;if(state.phase!=='ready'){state.sent=state.images;state.images=[];}}
 const input=root.querySelector('[data-input]'),send=root.querySelector('[data-send]'),grid=root.querySelector('[data-images]'),messages=root.querySelector('[data-messages]'),files=root.querySelector('[data-files]'),drop=root.querySelector('[data-drop]'),error=root.querySelector('[data-error]');
 const icons=()=>{if(globalThis.lucide)lucide.createIcons();};
 const persist=()=>{window.openai?.setWidgetState?.({modelContent:{design:'聊天输入区多图上传',phase:state.phase,imageCount:state.images.length,deadlinePolicy:'未回答保持未填写'},privateContent:null}).catch(()=>{});};
 function sample(){return Array.from({length:7},()=>'<span class="p-document-line"></span>').join('');}
 function picture(item){const p=document.createElement('div');p.className='p-picture';p.setAttribute('aria-label',item.name);if(item.url){const img=document.createElement('img');img.src=item.url;img.alt=item.name;p.append(img);}else p.innerHTML=sample();return p;}
 function renderImages(){
  grid.replaceChildren();
  state.images.forEach((item)=>{const card=document.createElement('div');card.className='p-attachment';card.append(picture(item));const remove=document.createElement('button');remove.type='button';remove.className='p-remove';remove.setAttribute('aria-label','移除'+item.name);remove.innerHTML='<i data-lucide="x" aria-hidden="true"></i>';remove.onclick=()=>{state.images=state.images.filter(x=>x.id!==item.id);if(item.url)URL.revokeObjectURL(item.url);renderImages();persist();};const name=document.createElement('span');name.className='p-filename';name.textContent=item.name;name.setAttribute('data-tooltip',item.name);card.append(remove,name);grid.append(card);});
  if(state.images.length){const add=document.createElement('button');add.type='button';add.className='p-add';add.setAttribute('aria-label','继续添加图片');add.innerHTML='<i data-lucide="plus" aria-hidden="true"></i><span>添加图片</span>';add.onclick=()=>files.click();grid.append(add);}
  grid.hidden=!state.images.length;root.querySelector('[data-count]').textContent=state.images.length?state.images.length+' 张图片':'';root.querySelector('[data-disclosure]').hidden=!state.images.length;updateSend();icons();
 }
 function updateSend(){send.disabled=!state.images.length&&!input.value.trim();}
 function assistantName(){return '<div class="p-assistant-name"><i data-lucide="sparkle" aria-hidden="true"></i>课间</div>';}
 function renderConversation(){
  messages.replaceChildren();
  if(state.phase==='ready'){messages.innerHTML='<div class="p-assistant p-intro">'+assistantName()+'<p>把作业截图发给我，我来整理。</p></div>';icons();return;}
  const bubble=document.createElement('div');bubble.className='p-user';const photos=document.createElement('div');photos.className='p-sent-images';state.sent.forEach(item=>photos.append(picture(item)));bubble.append(photos);if(state.note){const text=document.createElement('p');text.textContent=state.note;bubble.append(text);}messages.append(bubble);
  const reply=document.createElement('div');reply.className='p-assistant';reply.innerHTML=assistantName()+'<p>识别到 2 项作业：</p><ol class="p-tasklist"><li class="p-task"><span class="p-index">1</span><div><h3>高等数学 · 第六章习题</h3><p data-deadline="0"></p></div></li><li class="p-task"><span class="p-index">2</span><div><h3>英语 · Unit 4 听力练习</h3><p data-deadline="1"></p></div></li></ol>';
  reply.querySelectorAll('[data-deadline]').forEach(el=>el.textContent=state.deadlines[Number(el.dataset.deadline)]);
  if(state.phase==='saved')reply.innerHTML+='<p class="p-saved"><i data-lucide="circle-check" aria-hidden="true"></i>两项作业已保存 · 预览演示</p>';
  else{
   const question=document.createElement('p');question.textContent=state.skipped?'好的，截止日期先留空，之后可以补充。':'这两项作业分别什么时候截止？可以按编号回复，也可以暂不填写。';reply.append(question);
   const actions=document.createElement('div');actions.className='p-review-actions';const skip=document.createElement('button');skip.type='button';skip.className='p-quiet';skip.textContent='暂不填写';skip.onclick=()=>{state.skipped=true;renderConversation();persist();};const save=document.createElement('button');save.type='button';save.className='p-primary';save.textContent='确认保存 2 项';save.onclick=()=>{state.phase='saved';renderConversation();persist();};if(!state.skipped)actions.append(skip);actions.append(save);reply.append(actions);
  }
  messages.append(reply);icons();
 }
 function addFiles(list){
  const items=Array.from(list);if(!items.length)return;
  if(items.some(x=>!['image/png','image/jpeg','image/webp'].includes(x.type)||x.size>10*1024*1024)){error.hidden=false;error.textContent='请添加 10 MB 内的 PNG、JPG 或 WebP 图片';return;}
  error.hidden=true;state.images.push(...items.map(x=>({id:crypto.randomUUID(),name:x.name,url:URL.createObjectURL(x)})));renderImages();persist();
 }
 root.querySelector('[data-attach]').onclick=()=>files.click();files.onchange=()=>{addFiles(files.files);files.value='';};
 drop.ondragover=e=>{e.preventDefault();drop.classList.add('p-drag');};drop.ondragleave=()=>drop.classList.remove('p-drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('p-drag');addFiles(e.dataTransfer.files);};
 input.onpaste=e=>{if(e.clipboardData?.files.length){e.preventDefault();addFiles(e.clipboardData.files);}};input.oninput=updateSend;
 send.onclick=()=>{if(send.disabled)return;if(state.phase==='ready'||state.images.length){state.sent=state.images;state.images=[];state.note=input.value;state.phase='review';state.skipped=false;state.deadlines=['未填写截止日期','未填写截止日期'];}else{const text=input.value.trim();const first=text.match(/(?:第一项|第1项|1[.、])([^，,。；;]+)/);if(first&&!/不填|留空|暂不/.test(first[1]))state.deadlines[0]='待校对：'+first[1].trim();if(/第二|第2|2[.、]/.test(text)&&/不填|留空|暂不/.test(text))state.deadlines[1]='未填写截止日期';if(/暂不|不填|留空/.test(text))state.skipped=true;}
  input.value='';error.hidden=true;renderImages();renderConversation();persist();};
 input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send.click();}};
 root.querySelector('[data-reset]').onclick=()=>{state.images.forEach(x=>{if(x.url)URL.revokeObjectURL(x.url);});state.images=[{id:'sample-math',name:'高数作业.png'},{id:'sample-english',name:'英语听力.png'}];state.phase='ready';state.sent=[];state.note='';state.skipped=false;state.deadlines=['未填写截止日期','未填写截止日期'];input.value='';error.hidden=true;renderImages();renderConversation();persist();};
 window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState?.modelContent;if(incoming?.design==='聊天输入区多图上传'&&['ready','review','saved'].includes(incoming.phase)&&incoming.phase!==state.phase){state.phase=incoming.phase;if(state.phase!=='ready'&&!state.sent.length){state.sent=state.images;state.images=[];}renderImages();renderConversation();}});
 renderImages();renderConversation();
 if(globalThis.Tweak){const design={size:96};const tweak=new Tweak({container:drop,onChange:()=>root.style.setProperty('--thumb',design.size+'px')});tweak.addSlider(design,'size',{label:'图片预览大小',min:72,max:112,step:8,unit:'px'});}
})();
</script>
</div>
