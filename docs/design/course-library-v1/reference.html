@media(max-width:600px){#course-library-preview .cp-window{grid-template-columns:56px minmax(0,1fr);height:728px}#course-library-preview .cp-sidebar{padding:23px 5px 15px}#course-library-preview .cp-brand{font-size:0;padding:0 0 27px;justify-content:center}#course-library-preview .cp-brand b{width:7px;height:7px}#course-library-preview .cp-navbutton{padding:0;justify-content:center}#course-library-preview .cp-navbutton span,#course-library-preview .cp-local{display:none}#course-library-preview .cp-separation{margin:0 9px}#course-library-preview .cp-page{padding:28px 16px 20px}#course-library-preview .cp-heading{gap:8px;margin-bottom:23px;flex-wrap:wrap}#course-library-preview h1{font-size:23px}#course-library-preview .cp-heading>.cp-button{font-size:12px;padding:8px 10px}#course-library-preview .cp-tablehead,#course-library-preview .cp-file{grid-template-columns:minmax(0,1fr) 28px}#course-library-preview .cp-coursecell{display:none}#course-library-preview .cp-toolbar{flex-wrap:wrap}#course-library-preview .cp-search{max-width:none;flex-basis:100%}#course-library-preview .cp-sort{margin-left:auto}#course-library-preview .cp-courses{gap:3px;margin-bottom:16px}#course-library-preview .cp-chip{font-size:12px;padding:6px 8px}#course-library-preview .cp-file{padding:15px 0}#course-library-preview .cp-filename{gap:9px}#course-library-preview .cp-drawer{padding:20px}#course-library-preview .cp-dialog{padding:20px}#course-library-preview .cp-chatbody h2{font-size:21px}}

<div id="course-library-preview">
 <div class="cp-window" aria-label="课间 · 课程资料设计预览">
  <aside class="cp-sidebar" aria-label="侧边栏">
   <div class="cp-brand">课间<b aria-hidden="true"></b></div>
   <button class="cp-navbutton cp-assistant" data-page="assistant" aria-label="助手"><i data-lucide="message-square" aria-hidden="true"></i><span>助手</span></button>
   <div class="cp-separation" aria-hidden="true"></div>
   <nav class="cp-navgroup" aria-label="主导航">
    <button class="cp-navbutton" data-page="today" aria-label="今日"><i data-lucide="house" aria-hidden="true"></i><span>今日</span></button>
    <button class="cp-navbutton" data-page="calendar" aria-label="日程"><i data-lucide="calendar-days" aria-hidden="true"></i><span>日程</span></button>
    <button class="cp-navbutton" data-page="tasks" aria-label="任务"><i data-lucide="circle-check" aria-hidden="true"></i><span>任务</span></button>
    <button class="cp-navbutton" data-page="library" aria-current="page" aria-label="课程资料"><i data-lucide="folder-open" aria-hidden="true"></i><span>课程资料</span></button>
   </nav>
   <div class="cp-bottom"><button class="cp-navbutton" data-page="settings" aria-label="设置"><i data-lucide="sliders-horizontal" aria-hidden="true"></i><span>设置</span></button><div class="cp-local"><i aria-hidden="true"></i>本机</div></div>
  </aside>
  <main class="cp-main">
   <section class="cp-page" id="cp-library-page" aria-label="课程资料">
    <header class="cp-heading"><div><h1>课程资料</h1><p class="cp-subtitle" id="cp-summary">全部文件 · 8 份</p></div><button class="cp-button cp-primary" id="cp-upload"><i data-lucide="plus" aria-hidden="true"></i>上传资料</button></header>
    <div class="cp-courses" id="cp-course-filters" aria-label="按课程筛选"></div>
    <div class="cp-toolbar"><label class="cp-search"><i data-lucide="search" aria-hidden="true"></i><input id="cp-search" placeholder="搜索文件名" aria-label="搜索文件名"></label><select class="cp-sort" id="cp-sort" aria-label="文件排序"><option value="new">最近上传</option><option value="name">文件名称</option></select></div>
    <div class="cp-tablehead" aria-hidden="true"><span>文件名称</span><span class="cp-coursecell">所属课程</span><span class="cp-date">上传时间</span><span></span></div>
    <div id="cp-files" role="list" aria-label="已上传文件"></div>
    <p class="cp-status" id="cp-status" aria-live="polite"></p>
   </section>
   <section class="cp-page" id="cp-assistant-page" aria-label="助手" hidden><div class="cp-chatpage"><header><h1>助手</h1><p class="cp-subtitle">新会话</p></header><div class="cp-chatbody"><h2>今天想一起完成什么？</h2><p>整理作业、阅读资料，或安排接下来的学习。</p><div id="cp-chat-context" class="cp-context" hidden><i data-lucide="file-text" aria-hidden="true"></i><span></span><button class="cp-icon" id="cp-clear-context" aria-label="移除选用资料"><i data-lucide="x" aria-hidden="true"></i></button></div></div><div class="cp-composer"><textarea placeholder="给助手发消息…" aria-label="给助手的消息"></textarea><div class="cp-composebottom"><button class="cp-link" id="cp-select-source">＋ 选择资料</button><button class="cp-button cp-primary" id="cp-demo-send">发送</button></div></div><p class="cp-subtitle" id="cp-chat-status" aria-live="polite"></p></div></section>
   <section class="cp-page" id="cp-other-page" hidden><header><h1 id="cp-other-title">今日</h1></header><p class="cp-other">保留现有功能与页面布局。</p></section>
   <aside class="cp-drawer" id="cp-detail" aria-label="文件详情" hidden>
    <div class="cp-detailhead"><h2>文件详情</h2><button class="cp-icon" id="cp-close-detail" aria-label="关闭文件详情"><i data-lucide="x" aria-hidden="true"></i></button></div>
    <div class="cp-name" id="cp-detail-name"></div><p class="cp-subtitle" id="cp-detail-meta"></p>
    <label class="cp-field">所属课程<select id="cp-detail-course"></select></label>
    <div class="cp-document"><h3 id="cp-excerpt-title">第三章 · 微分中值定理</h3><p id="cp-excerpt-body">设函数在闭区间上连续，在开区间内可导，则存在一点，使函数在该点的导数等于两端点连线的斜率。</p><p>阅读时可结合课堂例题，梳理适用条件与证明思路。</p></div><p class="cp-location" id="cp-location">原文片段 · 第 2 页</p>
    <div class="cp-actions"><button class="cp-button cp-primary" id="cp-use-source">用这份资料提问</button><button class="cp-button" id="cp-save-course">保存分类</button></div><p class="cp-status" id="cp-detail-status" aria-live="polite"></p>
   </aside>
  </main>
  <div class="cp-veil" id="cp-upload-dialog" hidden><section class="cp-dialog" role="dialog" aria-modal="true" aria-labelledby="cp-upload-title"><div class="cp-detailhead"><h2 id="cp-upload-title">上传资料</h2><button class="cp-icon" id="cp-close-upload" aria-label="关闭上传窗口"><i data-lucide="x" aria-hidden="true"></i></button></div><label class="cp-field">所属课程<select id="cp-upload-course"></select></label><label class="cp-drop" id="cp-drop"><i data-lucide="upload" aria-hidden="true"></i><span>拖入文件，或选择文件</span><input type="file" multiple id="cp-file-input" accept=".pdf,.docx,.pptx,.xlsx,.txt,.md" aria-label="选择资料文件"><small>PDF、Word、PPT、Excel、TXT、Markdown</small></label><p class="cp-subtitle" id="cp-chosen">尚未选择文件</p><p class="cp-status" id="cp-upload-status" aria-live="polite"></p><div class="cp-dialogfooter"><button class="cp-button" id="cp-cancel-upload">取消</button><button class="cp-button cp-primary" id="cp-confirm-upload" disabled>添加到资料库</button></div></section></div>
 </div>
</div>
<script>
(()=>{
 const root=document.getElementById('course-library-preview');
 const $=s=>root.querySelector(s);
 const courses=['高等数学','数据结构','大学物理','未分类'];
 let files=[
 {id:1,name:'第三章 · 微分中值定理.pdf',course:'高等数学',type:'PDF',size:'2.4 MB',date:'今天',rank:8},
 {id:2,name:'线性表与链表.pptx',course:'数据结构',type:'PPT',size:'5.8 MB',date:'今天',rank:7},
 {id:3,name:'大学物理 · 第二章讲义.pdf',course:'大学物理',type:'PDF',size:'3.1 MB',date:'昨天',rank:6},
 {id:4,name:'高数习题课笔记.md',course:'高等数学',type:'MD',size:'18 KB',date:'昨天',rank:5},
 {id:5,name:'实验数据记录.xlsx',course:'大学物理',type:'XLS',size:'42 KB',date:'10月31日',rank:4},
 {id:6,name:'数据结构课程说明.docx',course:'数据结构',type:'DOC',size:'128 KB',date:'10月30日',rank:3},
 {id:7,name:'期中复习范围.pdf',course:'高等数学',type:'PDF',size:'864 KB',date:'10月29日',rank:2},
 {id:8,name:'阅读摘记.txt',course:'未分类',type:'TXT',size:'6 KB',date:'10月28日',rank:1}
 ];
 let course='全部',page='library',selected=null,pending=[],contextName='';
 const escape=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
 const icons=()=>{if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}});};
 function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:'course-library-sidebar',course,page},privateContent:null}).catch(()=>{});}
 function nav(next,save=true){page=next;$('#cp-library-page').hidden=next!=='library';$('#cp-assistant-page').hidden=next!=='assistant';$('#cp-other-page').hidden=['library','assistant'].includes(next);$('#cp-detail').hidden=true;root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===next)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('#cp-other-title').textContent={today:'今日',calendar:'日程',tasks:'任务',settings:'设置'}[next]||'';if(save)persist();}
 function render(){
  $('#cp-summary').textContent=(course==='全部'?'全部文件':course)+' · '+files.filter(f=>course==='全部'||f.course===course).length+' 份';
  $('#cp-course-filters').innerHTML=['全部',...courses].map(c=>'<button class="cp-chip" aria-pressed="'+(c===course)+'" data-course="'+c+'">'+c+'<small>'+files.filter(f=>c==='全部'||f.course===c).length+'</small></button>').join('');
  const q=$('#cp-search').value.trim().toLowerCase();let rows=files.filter(f=>(course==='全部'||f.course===course)&&f.name.toLowerCase().includes(q));rows.sort($('#cp-sort').value==='name'?(a,b)=>a.name.localeCompare(b.name,'zh'):(a,b)=>b.rank-a.rank);
  $('#cp-files').innerHTML=rows.length?rows.map(f=>'<div class="cp-file" role="listitem"><button class="cp-filename" data-file="'+f.id+'" aria-label="查看 '+escape(f.name)+'"><span class="cp-filetype">'+escape(f.type)+'</span><span><span class="cp-name">'+escape(f.name)+'</span><span class="cp-filemeta" style="display:block">'+escape(f.size)+'</span></span></button><span class="cp-cell cp-coursecell">'+escape(f.course)+'</span><span class="cp-cell cp-date">'+escape(f.date)+'</span><button class="cp-icon" data-file="'+f.id+'" aria-label="'+escape(f.name)+'的详情"><i data-lucide="chevron-right" aria-hidden="true"></i></button></div>').join(''):'<p class="cp-empty">没有匹配的文件</p>';
  $('#cp-course-filters').querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{course=b.dataset.course;render();persist();});
  $('#cp-files').querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>detail(Number(b.dataset.file)));icons();
 }
 function detail(id){selected=files.find(f=>f.id===id);$('#cp-detail-name').textContent=selected.name;$('#cp-detail-meta').textContent=selected.type+' · '+selected.size+' · '+selected.date+'上传';$('#cp-detail-course').value=selected.course;$('#cp-detail-status').textContent='';$('#cp-excerpt-title').textContent=selected.name.replace(/\.[^.]+$/,'');$('#cp-excerpt-body').textContent=selected.course==='高等数学'?'设函数在闭区间上连续，在开区间内可导，则存在一点，使函数在该点的导数等于两端点连线的斜率。':selected.course==='数据结构'?'线性表是由有限个数据元素组成的有序序列。顺序存储与链式存储在访问和修改时各有适用场景。':selected.course==='大学物理'?'实验记录应保留测量条件、原始数据与单位，并区分直接测量量和计算结果。':'此处展示已解析的原文片段。';$('#cp-location').textContent=selected.type==='PDF'?'原文片段 · 第 2 页':'原文片段 · 第 1 段';$('#cp-detail').hidden=false;}
 function closeUpload(){$('#cp-upload-dialog').hidden=true;pending=[];$('#cp-file-input').value='';$('#cp-chosen').textContent='尚未选择文件';$('#cp-confirm-upload').disabled=true;$('#cp-upload-status').textContent='';$('#cp-upload').focus();}
 function pick(list){pending=Array.from(list);const bad=pending.length>5||pending.some(f=>f.size>20*1024*1024||!(/\.(pdf|docx|pptx|xlsx|txt|md)$/i.test(f.name)));$('#cp-chosen').textContent=pending.length?pending.map(f=>f.name).join('、'):'尚未选择文件';$('#cp-upload-status').textContent=bad?'最多5份，每份不超过20 MiB，请选择支持的格式。':'';$('#cp-confirm-upload').disabled=!pending.length||bad;}
 ['#cp-detail-course','#cp-upload-course'].forEach(sel=>{$(sel).innerHTML=courses.map(c=>'<option>'+c+'</option>').join('');});
 root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));$('#cp-search').oninput=render;$('#cp-sort').onchange=render;
 $('#cp-close-detail').onclick=()=>{$('#cp-detail').hidden=true;};$('#cp-save-course').onclick=()=>{selected.course=$('#cp-detail-course').value;render();$('#cp-detail-status').textContent='分类已更新';};
 $('#cp-use-source').onclick=()=>{contextName=selected.name;$('#cp-chat-context span').textContent=contextName;$('#cp-chat-context').hidden=false;nav('assistant');};
 $('#cp-clear-context').onclick=()=>{contextName='';$('#cp-chat-context').hidden=true;};$('#cp-select-source').onclick=()=>nav('library');$('#cp-demo-send').onclick=()=>{$('#cp-chat-status').textContent='这是交互预览，消息不会发送。';};
 $('#cp-upload').onclick=()=>{$('#cp-upload-course').value=course==='全部'?'未分类':course;$('#cp-upload-dialog').hidden=false;$('#cp-close-upload').focus();};$('#cp-close-upload').onclick=closeUpload;$('#cp-cancel-upload').onclick=closeUpload;$('#cp-file-input').onchange=e=>pick(e.target.files);
 $('#cp-drop').ondragover=e=>e.preventDefault();$('#cp-drop').ondrop=e=>{e.preventDefault();pick(e.dataTransfer.files);};
 $('#cp-confirm-upload').onclick=()=>{const c=$('#cp-upload-course').value;pending.forEach(f=>files.push({id:Date.now()+files.length,name:f.name,course:c,type:f.name.split('.').pop().toUpperCase().slice(0,3),size:f.size>1048576?(f.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(f.size/1024))+' KB',date:'刚刚',rank:Date.now()+files.length}));course=c;closeUpload();render();$('#cp-status').textContent='已添加到预览列表，未读取或上传文件内容。';};
 root.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#cp-upload-dialog').hidden)closeUpload();else $('#cp-detail').hidden=true;}});
 const saved=window.openai?.widgetState?.modelContent;if(saved?.design==='course-library-sidebar'){if(['全部',...courses].includes(saved.course))course=saved.course;if(saved.page)page=saved.page;}
 render();nav(page,false);
 if(globalThis.Tweak){const settings={gap:40};const t=new Tweak({container:root.querySelector('.cp-sidebar'),onChange:()=>{root.querySelector('.cp-separation').style.height=settings.gap+'px';root.querySelector('.cp-separation').style.minHeight=settings.gap+'px';}});t.addSlider(settings,'gap',{label:'助手下方留白',min:24,max:64,step:4,unit:'px'});}
})();
</script>
