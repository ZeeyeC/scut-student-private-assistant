  /** @type {MessagePort | null} */

  const postToHost = (type, payload) => {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) => {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("open-external", { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) => {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("follow-up", { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record<string, unknown> | ((previous: Record<string, unknown> | null) => Record<string, unknown>)} next
   * @returns {Promise<void>}
   */
  const setWidgetState = async (next) => {
    const nextState = typeof next === "function" ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== "object" ||
      isArray(nextState)
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) => {
        if (
          typeof value === "undefined" ||
          typeof value === "function" ||
          typeof value === "symbol" ||
          (typeof value === "number" && !Number.isFinite(value))
        ) {
          throw new TypeError("Widget state must be a JSON object");
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== "object" ||
      isArray(parsedState)
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    if (
      hasOwn(storedState, "imageIds") &&
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) => typeof id !== "string",
        ))
    ) {
      throw new TypeError("Widget state imageIds must be an array of strings");
    }
    if (storedState.imageIds?.length > 0) {
      throw Object.assign(
        new TypeError("Visualization state does not support image attachments"),
        { code: -32602, data: { code: "images_unsupported" } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === "none") {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) => {
      const timeout = globalThis.setTimeout(() => {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost("widget-state-write", { id, state: serializedState });
    });
  };
  const syncTheme = () => {
    const theme = mediaQuery.matches ? "dark" : "light";
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: "none",
    };
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () => {
    postToHost("height", {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    "message",
    (event) => {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== "object" ||
        data?.type !== "codex-visualization-initialize" ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          "message",
          (event) => {
            const data = apply(getMessageData, event, []);
            if (typeof data === "object" && data?.type === "measure") {
              sendHeight();
            } else if (
              typeof data === "object" &&
              data?.type === "widget-state-result"
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== "number") {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost("widget-state-write", { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener("change", syncTheme);
  globalThis.addEventListener("click", (event) => {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest("a[href]");
    const href = link?.getAttribute("href");
    if (href == null) {
      return;
    }
    if (href.startsWith("#")) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost("scroll-to", {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
</script>

<script>
(()=>{
const root=document.getElementById('campus-ui-revision');
const main=root.querySelector('.cr-main');
const windowRoot=root.querySelector('.cr-window');
const drawer=root.querySelector('.cr-drawer');
const petPanel=root.querySelector('.cr-pet-panel');
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const button=(label,action,primary=false)=>`<button type="button" class="cr-button cursor-interaction${primary?' cr-primary':''}" data-action="${action}">${label}</button>`;
const link=(label,action)=>`<button type="button" class="cr-text-button cursor-interaction" data-action="${action}">${label}</button>`;
const saved=window.openai?.widgetState?.privateContent;
let state={page:'today',taskTab:'todos',calendarFilter:'all',petOpen:false,petSelected:null,search:'',...saved};
if(!['today','calendar','tasks','assistant','settings'].includes(state.page))state.page='today';
const tasks=[
 {id:'math',title:'高数 · 第三章习题',course:'高等数学',due:'今天 18:00',minutes:45,time:'14:00',requirements:'完成第三章第 1–8 题，并整理两道错题。'},
 {id:'report',title:'数据结构实验报告',course:'数据结构',due:'明天 18:00',minutes:60,time:'16:00',requirements:'补充运行结果与复杂度分析。'},
 {id:'english',title:'英语听力练习',course:'大学英语',due:'今天',minutes:20,time:'16:20',requirements:'完成一组听力，整理生词。'},
 {id:'physics',title:'物理实验预习',course:'大学物理',due:'明天',minutes:30,time:'19:00',requirements:'阅读实验原理，填写预习记录。'},
 {id:'linear',title:'线性代数复习',course:'线性代数',due:'周日',minutes:40,time:'',requirements:'复习向量空间与线性变换。'},
 {id:'code',title:'代码练习',course:'数据结构',due:'周日',minutes:45,time:'',requirements:'练习二叉树遍历与递归。'},
 {id:'reading',title:'英语阅读',course:'大学英语',due:'下周一',minutes:25,time:'',requirements:'阅读课文并完成练习。'},
 {id:'notes',title:'整理本周课堂笔记',course:'学习整理',due:'周日',minutes:30,time:'',requirements:'归纳本周知识点。'},
 {id:'preview',title:'下周课程预习',course:'学习整理',due:'周日',minutes:35,time:'',requirements:'提前查看下周课程材料。'}
];
const done=new Set(Array.isArray(saved?.done)?saved.done:[]);
function remember(){window.openai?.setWidgetState?.({modelContent:{design:'ui-redesign-v2',page:state.page,petOpen:state.petOpen,demoOnly:true},privateContent:{...state,done:[...done]}})?.catch(()=>{});}
function icons(){globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}
function head(title,actions='',date=''){return `<header class="cr-page-head"><div class="cr-page-title"><h1>${title}</h1>${date?`<small>${date}</small>`:''}</div><div class="cr-actions">${actions}</div></header>`;}
function row(t,table=false){return `<div class="cr-task-row${done.has(t.id)?' cr-done':''}"><input type="checkbox" data-complete="${t.id}" aria-label="完成${esc(t.title)}" ${done.has(t.id)?'checked':''}><div><button type="button" class="cr-task-title cursor-interaction" data-task="${t.id}">${esc(t.title)}</button><div class="cr-task-meta">${esc(t.course)}${table?'':'　'+esc(t.due)}</div></div><span class="cr-task-time">${table?`<span>${esc(t.due)}</span>`:''}<span>${t.minutes} 分钟</span></span></div>`;}
function today(){const t=tasks[0];return head('今日',`<span class="cr-inbox">${link(icon('inbox')+' 待确认 2','inbox')}</span>${button('安排今天','plan')}`,'10月30日 · 周五')+`<div class="cr-today-grid"><div><section class="cr-next"><div class="cr-next-top"><span>接下来</span><time>14:00</time></div><h2><button type="button" class="cursor-interaction" data-task="math">${t.title}</button></h2><p class="cr-next-meta">14:00–14:45　·　45 分钟</p><div class="cr-next-bottom"><small>高等数学</small>${button(icon('play')+' 开始专注','focus',true)}</div></section><section><div class="cr-section-head"><h2>其他待办<small>4</small></h2>${link('全部任务 '+icon('arrow-up-right'),'tasks')}</div>${row(tasks[1])}${row(tasks[2])}${row(tasks[3])}${link(icon('plus')+' 添加任务','add')}</section></div><aside class="cr-agenda"><div class="cr-section-head"><h2>今日安排</h2>${link('查看日程','calendar')}</div>${[['09:00','高等数学','A1-201 · 09:00–10:35'],['11:00','数据结构复习','25 分钟'],['14:00','高数习题','14:00–14:45'],['16:20','英语听力','20 分钟']].map((a,i)=>`<div class="cr-agenda-item${i===2?' cr-active':''}"><time>${a[0]}</time><button type="button" class="cr-agenda-entry cursor-interaction" data-action="${i===0?'course':'agenda'}"><strong>${a[1]}</strong><small>${a[2]}</small></button></div>`).join('')}<p class="cr-agenda-note">待安排 60 分钟<br>今晚 19:00–21:00 有空</p></aside></div>`;}
const events=[{day:0,top:6,height:72,title:'高等数学',room:'A1-201'},{day:1,top:54,height:72,title:'大学英语',room:'A3-302'},{day:2,top:6,height:72,title:'数据结构',room:'A2-105'},{day:3,top:54,height:72,title:'线性代数',room:'A1-206'},{day:4,top:6,height:72,title:'高等数学',room:'A1-201'},{day:0,top:246,height:40,title:'高数习题',study:true},{day:1,top:294,height:44,title:'实验报告',study:true},{day:2,top:246,height:44,title:'课程复习',study:true},{day:4,top:246,height:40,title:'高数习题',study:true},{day:5,top:54,height:72,title:'实验报告',study:true}];
function calendar(){return head('日程',button(icon('upload')+' 导入课表','import')+button('安排','plan',true))+`<div class="cr-subtabs" aria-label="日程筛选">${[['all','全部'],['courses','课程'],['study','学习']].map(([id,label])=>`<button type="button" class="cursor-interaction" data-filter="${id}" aria-pressed="${state.calendarFilter===id}">${label}</button>`).join('')}</div><div class="cr-calendar-tools"><div class="cr-actions"><strong>10月26日–11月1日</strong><small>本周</small></div>${link('课程规则','rules')}</div><div class="cr-week"><div class="cr-week-head"><div></div>${['周一','周二','周三','周四','周五','周六','周日'].map((d,i)=>`<div class="${i===4?'cr-current':''}"><span>${d}</span><b>${i===6?1:26+i}</b></div>`).join('')}</div><div class="cr-week-body"><div class="cr-hours">${Array.from({length:10},(_,i)=>`<span>${String(9+i).padStart(2,'0')}:00</span>`).join('')}</div>${Array.from({length:7},(_,i)=>`<div class="cr-day-column${i===4?' cr-current':''}">${events.filter(e=>e.day===i&&(state.calendarFilter==='all'||(state.calendarFilter==='study'?e.study:!e.study))).map(e=>`<button type="button" class="cr-event cursor-interaction${e.study?' cr-study':''}" data-action="${e.study?'agenda':'course'}" style="top:${e.top}px;height:${e.height}px"><strong>${e.title}</strong>${e.room?`<small>${e.room}</small>`:''}</button>`).join('')}</div>`).join('')}</div></div><div class="cr-day-list"><h2>10月30日 · 周五</h2>${row(tasks[0])}${row(tasks[2])}${link('高等数学　09:00–10:35','course')}</div>`;}
function taskPage(){let content='';if(state.taskTab==='goals')content=[['高数期中复习','本周完成第三、四章习题',60],['英语听力','每周练习 4 次',50]].map(g=>`<section class="cr-goal"><div><h3>${g[0]}</h3><small>${g[1]}</small></div><div><small>${g[2]}%</small><progress value="${g[2]}" max="100" aria-label="${g[0]}进度"></progress></div></section>`).join('');else if(state.taskTab==='review')content=`<div class="cr-review-numbers"><div><small>本周学习</small><strong>12.5 <small>小时</small></strong></div><div><small>完成任务</small><strong>8 <small>项</small></strong></div></div>${row(tasks[0])}${row(tasks[2])}`;else content=`<div class="cr-list-toolbar"><label class="cr-search">${icon('search')}<input aria-label="搜索任务" placeholder="搜索任务" value="${esc(state.search)}" data-search></label><small>未完成 ${tasks.length-done.size}</small></div><div class="cr-task-table-head"><span>任务</span><span>截止</span><span>预计</span></div><div class="cr-task-table" data-task-results>${tasks.filter(t=>t.title.includes(state.search)||t.course.includes(state.search)).map(t=>row(t,true)).join('')}</div>`;return head('任务',button(icon('plus')+' 添加任务','add',true))+`<div class="cr-subtabs" aria-label="任务分类">${[['todos','待办'],['goals','目标'],['review','复盘']].map(([id,label])=>`<button type="button" class="cursor-interaction" data-task-tab="${id}" aria-pressed="${state.taskTab===id}">${label}</button>`).join('')}</div>`+content;}
function assistant(){return head('助手')+`<div class="cr-chat"><div class="cr-conversation"><span>今天的学习安排</span>${link('会话记录','history')}</div><div class="cr-messages"><div class="cr-message cr-user">帮我安排今天剩下的学习任务。</div><div class="cr-message"><small>课间</small>下午先完成高数习题，晚间留出一小时写实验报告。<div class="cr-proposal"><div><span>14:00–14:45</span><span>高数习题</span></div><div><span>19:00–20:00</span><span>实验报告</span></div>${link('查看安排','plan')}</div></div></div><div class="cr-composer"><textarea aria-label="发送给助手的内容" placeholder="说说你想安排什么" data-message></textarea><div>${link(icon('paperclip')+' 附件','import')}${button(icon('arrow-up')+' 发送','send',true)}</div></div></div>`;}
function settings(){return head('设置')+[['calendar-days','课程与学期','学期、节次、课程规则','2026 秋季','semester'],['clock','学习偏好','学习时段、专注与休息','已设置','preferences'],['bell','提醒与桌宠','提醒、显示与动作','安静提醒','pet-settings'],['message-square','模型连接','服务与连接配置','已连接','model'],['folder','资料与备份','本机资料、导入与导出','本机保存','data']].map(a=>`<button type="button" class="cr-settings-row cursor-interaction" data-action="${a[4]}">${icon(a[0])}<span><h3>${a[1]}</h3><small>${a[2]}</small></span><span class="cr-settings-value">${a[3]}</span>${icon('chevron-right')}</button>`).join('');}
function render(){main.innerHTML=({today,calendar,tasks:taskPage,assistant,settings}[state.page])();root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');if(!b.querySelector('span')?.textContent)return;b.setAttribute('aria-label',b.querySelector('span').textContent);});icons();}
let drawerAction='';let returnFocus=null;
function openDrawer(title,body,footer=''){returnFocus=document.activeElement;drawer.querySelector('[data-drawer-title]').textContent=title;drawer.querySelector('.cr-drawer-body').innerHTML=body;drawer.querySelector('.cr-drawer-footer').innerHTML=footer;drawer.hidden=false;root.querySelector('.cr-shade').hidden=false;root.querySelector('.cr-sidebar').inert=true;main.inert=true;drawer.setAttribute('role','dialog');drawer.setAttribute('aria-modal','true');drawer.querySelector('.cr-icon').focus();icons();}
function closeDrawer(){drawer.hidden=true;root.querySelector('.cr-shade').hidden=true;root.querySelector('.cr-sidebar').inert=false;main.inert=false;returnFocus?.isConnected&&returnFocus.focus();}
function taskDetail(id){const t=tasks.find(t=>t.id===id)||tasks[0];openDrawer('任务详情',`<h2 class="cr-detail-title">${esc(t.title)}</h2><small>${esc(t.course)}</small><dl class="cr-attributes"><dt>截止</dt><dd>${t.due}</dd><dt>预计</dt><dd>${t.minutes} 分钟</dd><dt>状态</dt><dd>${done.has(id)?'已完成':'未完成'}</dd></dl><h3>任务要求</h3><p class="cr-task-meta">${t.requirements}</p><div class="cr-steps"><h3>步骤</h3><div class="cr-step"><input type="checkbox" aria-label="整理知识点"><span>整理知识点</span><small>15 分钟</small></div><div class="cr-step"><input type="checkbox" aria-label="完成练习"><span>完成练习</span><small>30 分钟</small></div></div>`,button('关闭','close')+`<button type="button" class="cr-button cr-primary cursor-interaction" data-detail-complete="${id}">${done.has(id)?'重新打开':'标记完成'}</button>`);}
function importDrawer(){openDrawer('导入课表',`<section class="cr-browser-primary"><div class="cr-browser-head">${icon('globe')}<div><h3>从学校导入</h3><small>浏览器登录 · 回到 App 校对</small></div></div><p>打开学校课表，登录后由扩展读取课程。</p><div class="cr-browser-control"><select aria-label="课表导入浏览器"><option>Chrome</option><option>Edge</option></select>${button('打开浏览器导入','browser-import',true)}</div><p class="cr-status" data-import-status role="status" hidden></p></section><h3 class="cr-import-other">其他方式</h3><button type="button" class="cr-import-method cursor-interaction" data-action="image-import" aria-expanded="false"><span>${icon('file-image')}<span><h3>图片 / PDF</h3><small>选择课表截图或文件</small></span></span>${icon('chevron-down')}</button><div class="cr-import-expanded" data-image-import hidden><label>课表文件<input type="file" accept="image/*,application/pdf" aria-label="课表文件"></label><label class="cr-check-label"><input type="checkbox">同意将此课表发送给已配置的模型识别</label>${button('查看示例识别结果','import-preview')}</div><button type="button" class="cr-import-method cursor-interaction" data-action="text-import" aria-expanded="false"><span>${icon('text')}<span><h3>文字导入</h3><small>粘贴课程、时间和周次</small></span></span>${icon('chevron-down')}</button><div class="cr-import-expanded" data-text-import hidden><label>课程内容<textarea placeholder="粘贴课表文字" aria-label="课表文字"></textarea></label>${button('查看示例解析结果','import-preview')}</div><details class="cr-extension-help"><summary>首次使用：安装课表扩展</summary><ol><li>在所选浏览器启用扩展开发者模式。</li><li>加载 App 提供的扩展目录。</li><li>回到此处开始导入。</li></ol></details>`);}
function importPreview(){openDrawer('校对课表',`<small>示例课表 · 2 门课程</small><div class="cr-course-preview"><h3>高等数学</h3><small>周一、周五 · 09:00–10:35<br>A1-201 · 第1–16周</small></div><div class="cr-course-preview"><h3>数据结构</h3><small>周三 · 09:00–10:35<br>A2-105 · 第1–16周</small></div>`,button('返回','import')+button('确认导入','import-confirm',true));}
function plan(){openDrawer('安排今天',`<small>2 项任务 · 105 分钟</small><div class="cr-course-preview"><h3>14:00–14:45　高数习题</h3><small>45 分钟 · 高等数学</small></div><div class="cr-course-preview"><h3>19:00–20:00　实验报告</h3><small>60 分钟 · 数据结构</small></div>`,button('取消','close')+button('确认安排','close',true));}
function renderPet(){petPanel.hidden=!state.petOpen;root.querySelector('.cr-pet-character').setAttribute('aria-expanded',String(state.petOpen));const body=root.querySelector('.cr-pet-body');const selected=tasks.find(t=>t.id===state.petSelected);root.querySelector('[data-pet-heading]').textContent=selected?'任务详情':'待办';root.querySelector('[data-pet-count]').textContent=selected?'':`今日 ${tasks.slice(0,4).filter(t=>!done.has(t.id)).length} 项`;if(selected){body.innerHTML=`<div class="cr-pet-detail">${link(icon('arrow-left')+' 返回待办','pet-back')}<h3>${selected.title}</h3><small>${selected.course}</small><dl class="cr-attributes"><dt>安排</dt><dd>${selected.time||'待安排'}</dd><dt>预计</dt><dd>${selected.minutes} 分钟</dd><dt>截止</dt><dd>${selected.due}</dd></dl><p>${selected.requirements}</p></div>`;petPanel.querySelector('footer').innerHTML=link('在任务中查看 '+icon('arrow-up-right'),'pet-all')+`<button type="button" class="cr-text-button cursor-interaction" data-pet-complete="${selected.id}">${done.has(selected.id)?'重新打开':'标记完成'}</button>`;}else{body.innerHTML=tasks.slice(0,4).map(t=>`<div class="cr-pet-row${done.has(t.id)?' cr-done':''}"><input type="checkbox" data-complete="${t.id}" aria-label="完成${t.title}" ${done.has(t.id)?'checked':''}><button type="button" class="cursor-interaction" data-pet-task="${t.id}">${t.title}</button><small>${t.time}</small></div>`).join('');petPanel.querySelector('footer').innerHTML=link('全部任务 '+icon('arrow-up-right'),'pet-all')+'<span>课间</span>';}icons();}
function navigate(page){state.page=page;closeDrawer();main.scrollTop=0;render();remember();}
root.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;
 if(b.dataset.page){navigate(b.dataset.page);return;}
 if(b.dataset.task){taskDetail(b.dataset.task);return;}
 if(b.dataset.petTask){state.petSelected=b.dataset.petTask;renderPet();remember();return;}
 if(b.dataset.taskTab){state.taskTab=b.dataset.taskTab;render();remember();return;}
 if(b.dataset.filter){state.calendarFilter=b.dataset.filter;render();remember();return;}
 const completed=b.dataset.detailComplete||b.dataset.petComplete;if(completed){done.has(completed)?done.delete(completed):done.add(completed);render();renderPet();if(b.dataset.detailComplete)taskDetail(completed);remember();return;}
 const action=b.dataset.action;if(!action)return;
 if(action==='close'){closeDrawer();return;}
 if(action==='pet-toggle'){state.petOpen=!state.petOpen;state.petSelected=null;renderPet();remember();return;}
 if(action==='pet-close'){state.petOpen=false;renderPet();remember();return;}
 if(action==='pet-back'){state.petSelected=null;renderPet();remember();return;}
 if(action==='pet-all'){const selected=state.petSelected;state.petOpen=false;state.taskTab='todos';state.search='';navigate('tasks');renderPet();root.querySelector('#revision-app-tab').click();if(selected)taskDetail(selected);return;}
 if(['tasks','calendar'].includes(action)){navigate(action);return;}
 if(action==='import'){importDrawer();return;}
 if(action==='image-import'||action==='text-import'){const el=drawer.querySelector(action==='image-import'?'[data-image-import]':'[data-text-import]');el.hidden=!el.hidden;b.setAttribute('aria-expanded',String(!el.hidden));return;}

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">
  (() => {
    for (const root of document.querySelectorAll(".viz-carousel")) {
      const panels = Array.from(
        root.querySelectorAll(":scope > [data-variant]"),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute("role", "group");
      panels.forEach((panel, index) => {
        panel.hidden = index !== 0;
        panel.setAttribute("role", "group");
        if (!panel.hasAttribute("aria-label")) {
          panel.setAttribute("aria-label", panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement("div");
      controls.className = "viz-carousel-controls";
      // Portable copy of the settings dropdown's legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      <button type="button" class="viz-carousel-previous cursor-interaction"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <details class="viz-carousel-picker">
        <summary class="cursor-interaction">
          <span class="viz-carousel-count tabular-nums"></span>
          <span class="viz-carousel-name"></span>
          <svg class="viz-carousel-caret" width="14" height="14" viewBox="0 0 20 21" fill="none" aria-hidden="true" focusable="false">
            <path d="M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" />
          </svg>
        </summary>
        <div class="viz-carousel-options"></div>
      </details>
      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
      const previous = controls.querySelector(".viz-carousel-previous");
      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");
      const count = controls.querySelector(".viz-carousel-count");
      const name = controls.querySelector(".viz-carousel-name");
      const options = controls.querySelector(".viz-carousel-options");
      const status = document.createElement("span");
      status.className = "sr-only";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-atomic", "true");
      previous.setAttribute(
        "aria-label",
        root.dataset.previousLabel ?? "Previous variant",
      );
      next.setAttribute("aria-label", root.dataset.nextLabel ?? "Next variant");

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener("pointerdown", (event) => {
        summaryPointerHandled =
          event.pointerType === "mouse" && event.button === 0 && !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener("click", (event) => {
        if (summaryPointerHandled && event.detail > 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) => {
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "cursor-interaction";
        choice.textContent = panel.dataset.variant;
        choice.addEventListener("click", () => {
          select(index);
          summary.focus();
        });
        choice.addEventListener("pointerup", (event) => {
          if (
            picker.open &&
            event.pointerType === "mouse" &&
            event.button === 0 &&
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) => {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) => {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            "aria-current",
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),
      );
      picker.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>
