<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>课间 · 新界面设计</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body data-mode="full">
  <div class="preview-bar"><span>App 设计稿 <span class="preview-divider">/</span> 示例数据</span><div class="size-switch" aria-label="预览尺寸"><button data-mode="full" aria-pressed="true">主窗口</button><button data-mode="compact" aria-pressed="false">快捷面板</button></div></div>
  <div class="app" id="app">
    <div class="window-bar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><span>课间</span><button class="icon-button compact-settings" data-nav="settings" aria-label="设置"><i data-icon="settings"></i></button></div>
    <aside class="sidebar">
      <div class="brand">课间<span class="brand-dot"></span></div>
      <nav class="primary-nav" aria-label="主导航">
        <button data-nav="today" class="selected" aria-current="page"><i data-icon="today"></i><span>今日</span></button>
        <button data-nav="calendar"><i data-icon="calendar"></i><span>日程</span></button>
        <button data-nav="tasks"><i data-icon="task"></i><span>任务</span></button>
        <button data-nav="assistant"><i data-icon="chat"></i><span>助手</span></button>
      </nav>
      <div class="sidebar-bottom"><button data-nav="settings"><i data-icon="settings"></i><span>设置</span></button><span class="local-status"><i></i> 本机</span></div>
    </aside>
    <main id="main"></main>
    <div class="timer-dock" id="timer" hidden></div>
  </div>
  <dialog id="drawer" class="drawer" aria-labelledby="drawer-title"><div class="drawer-head"><h2 id="drawer-title"></h2><button class="icon-button" data-action="close" aria-label="关闭面板"><i data-icon="close"></i></button></div><div class="drawer-body" id="drawer-body"></div><div class="drawer-footer" id="drawer-footer"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="icons.js"></script><script src="ui.js"></script>
</body>
</html>
