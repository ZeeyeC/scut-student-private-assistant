services:
  assistant:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      APP_MODE: shared
      DATABASE_URL: sqlite+aiosqlite:////data/campus.db
      AGENT_DB_PATH: /data/agent.db
      UPLOAD_DIR: /data/uploads
      SECURE_COOKIE: 'true'
    volumes:
      - campus_data:/data
    expose: ['8000']
    restart: unless-stopped
  caddy:
    image: caddy:2
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports: ['80:80','443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped
volumes:
  campus_data:
  caddy_data:
