[project]
name = "campus-assistant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "alembic",
  "aiosqlite",
  "fastapi-users[sqlalchemy]",
  "deepagents",
  "langchain-openai",
  "langgraph-checkpoint-sqlite",
  "pandas",
  "lxml",
  "pillow",
  "tzdata",
  "python-multipart",
  "mcp-server-time==2026.10.10",
  "langchain-mcp-adapters==0.3.2",
  "mcp>=1.29,<2",
]

[dependency-groups]
desktop = [
    "pyinstaller==6.22.3",
]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
