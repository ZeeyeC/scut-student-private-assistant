[project]
name = "campus-assistant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "alembic",
  "aiosqlite",
  "fastapi-users[sqlalchemy]",
  "deepagents",
  "langchain-openai",
  "langgraph-checkpoint-sqlite",
  "pandas",
  "lxml",
  "pillow",
  "tzdata",
  "python-multipart",
  "mcp-server-time==2026.10.10",
  "langchain-mcp-adapters==0.3.2",
  "mcp>=1.29,<2",
  "pypdfium2>=5.14.0",
  "pypdf>=6.21.3",
  "markitdown[docx,pdf,pptx,xlsx]>=0.1,<0.2",
  "qdrant-client>=1.14,<2",
  "fastembed>=0.7,<1",
  "mcp-server-fetch>=2026.10.10",
  "httpx>=0.28,<1",
  "zotero-mcp-server>=0.15.2",
  "fastmcp>=2.14,<4",
  "pyzotero>=1.14,<1.15",
]

[dependency-groups]
desktop = [
    "pyinstaller==6.22.3",
]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
