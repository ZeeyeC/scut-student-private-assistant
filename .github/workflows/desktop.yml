name: Desktop native build
on: workflow_dispatch
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: macOS initializer tests
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s scripts/tests -p 'test_initialize_macos.py'
      - name: First macOS initialization without developer tools on PATH
        if: runner.os == 'macOS'
        run: env PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash scripts/initialize-macos.sh --no-launch
      - name: Windows initializer tests
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-initialize-windows.ps1
      - name: First Windows initialization without developer tools on PATH
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$PSHOME"
          ./scripts/initialize-windows.ps1 -NoLaunch
      - name: Backend verification
        if: runner.os != 'Windows'
        run: ./backend/.venv/bin/python -m pytest backend/tests -q
      - name: Windows backend verification
        if: runner.os == 'Windows'
        run: ./backend/.venv/Scripts/python.exe -m pytest backend/tests -q
      - name: Native bundle smoke test (Windows)
        if: runner.os == 'Windows'
        run: ./backend/.venv/Scripts/python.exe scripts/verify-desktop.py dist/desktop/CampusCompanion/CampusCompanion.exe
      - name: Native bundle smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./backend/.venv/bin/python scripts/verify-desktop.py "dist/desktop/课间助手.app/Contents/MacOS/CampusCompanion"
      - uses: actions/upload-artifact@v4
        with:
          name: campus-${{ matrix.os }}
          path: dist/desktop/*.zip
