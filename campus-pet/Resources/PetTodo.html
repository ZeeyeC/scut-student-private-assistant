<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>桌宠待办</title>
<style>
:root{color-scheme:light dark;--ink:light-dark(#252a35,#e5e8ef);--muted:light-dark(#71798b,#a3adbf);--line:light-dark(#e8ebf1,#323a48);--paper:light-dark(#fefefe,#202630);--accent:light-dark(#596bc6,#a1afea);--button:light-dark(#dfe3ec,#414b5d)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink);background:transparent}h2,h3,p{font-family:-apple-system-body,ui-sans-serif,-apple-system,system-ui,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif,"Segoe UI Emoji","Segoe UI Symbol";margin:0}h2{font-size:16px;line-height:1.5;font-weight:600}h3{font-size:16px;font-weight:500}small{font-size:12px;line-height:18px;color:var(--muted)}button,input{font:inherit;color:inherit;min-width:0}button{border:0;background:none;padding:0;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button svg{width:16px;height:16px;flex:none}input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}input[type=checkbox]:checked:after{content:"";display:block;width:4px;height:8px;border:solid white;border-width:0 1.5px 1.5px 0;transform:translate(5px,1px) rotate(45deg)}input[type=checkbox]{appearance:none;border:1px solid #767676;border-radius:2px;accent-color:var(--accent);width:16px;height:16px;padding:0;margin:0;flex:none}#panel{width:100%;height:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:65px;padding:14px 18px 13px;border-bottom:1px solid var(--line);flex:none}header>div{display:flex;align-items:baseline;gap:12px}header small{font-size:11px}.icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;color:var(--muted);border-radius:6px}#body{flex:1;min-height:0;overflow:auto;padding:3px 18px;overflow-wrap:anywhere}.row{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:11px;align-items:center;min-height:58px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row button{text-align:left;font-size:13px;line-height:1.5;padding:8px 0;overflow-wrap:anywhere}.row small{font-size:11px;white-space:nowrap}.row.done button{text-decoration:line-through;color:var(--muted)}footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);min-height:49px;flex:none}footer>span{font-size:11px;color:var(--muted)}.text{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:12px;line-height:18px}.detail{padding:13px 0}.detail h3{font-size:16px;margin:14px 0 7px}.attributes{display:grid;grid-template-columns:70px minmax(0,1fr);gap:11px;font-size:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin:16px 0}.attributes dt{color:var(--muted)}dd{margin:0}.detail p,.status{font-size:12px;color:var(--muted);line-height:1.8;white-space:pre-wrap}.status{padding:15px 0}.error{color:var(--ink);padding:10px 0;font-size:12px;line-height:1.8}#review{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} [hidden]{display:none!important}
</style>
<section id="panel" aria-label="桌宠待办窗口"><header><div><h2 id="heading">待办</h2><small id="count"></small></div><button class="icon" id="close" aria-label="关闭待办窗口">×</button></header><div id="body"></div><footer id="footer"></footer></section>
<script>
const emit=(action,id)=>window.webkit?.messageHandlers?.todo?.postMessage(id===undefined?{action}:{action,id});
const node=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;};
const button=(text,action,id,cls='text')=>{const el=node('button',cls,text);el.type='button';el.onclick=()=>emit(action,id);return el;};
// Icons are Lucide's X, ArrowLeft, ArrowUpRight paths (ISC; bundled project Lucide notice).
const icon=(el,name)=>{const ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','1.6');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.setAttribute('aria-hidden','true');for(const d of ({x:['M18 6 6 18','m6 6 12 12'],back:['m12 19-7-7 7-7','M5 12h14'],up:['M7 7h10v10','M7 17 17 7']}[name])){const p=document.createElementNS(ns,'path');p.setAttribute('d',d);s.append(p)}if(name==='back')el.prepend(s);else el.append(s);return el;};
const close=document.getElementById('close');close.textContent='';icon(close,'x');close.onclick=()=>emit('close');
let currentSelection;
window.renderTodo=state=>{
 const body=document.getElementById('body'),footer=document.getElementById('footer'),scroll=body.scrollTop;
 body.replaceChildren();footer.replaceChildren();document.getElementById('heading').textContent=state.selected?'任务详情':'待办';document.getElementById('count').textContent=state.selected?'':`今日 ${(state.tasks||[]).filter(t=>!t.done).length} 项`;
 if(state.selected){const d=node('div','detail');d.append(icon(button(' 返回待办','back'),'back'));if(state.detail){const v=state.detail;d.append(node('h3','',v.title),node('small','',v.course||''));const dl=node('dl','attributes');for(const [key,value] of [['安排',v.time],['预计',v.estimate],['截止',v.due]]){dl.append(node('dt','',key),node('dd','',value||'待确认'))}d.append(dl,node('p','',v.requirements||'未填写具体要求。'));for(const step of v.steps||[])d.append(node('p','',step));}else d.append(node('p','status',state.error||'正在读取待办详情…'));body.append(d);footer.append(icon(button('在任务中查看','all'),'up'));const task=(state.tasks||[]).find(t=>t.id===state.selected);if(task){const complete=button(task.done?'已完成':task.pending?'保存中…':'标记完成','complete',task.id);complete.disabled=!!(task.done||task.pending);footer.append(complete)}}
 else if(state.status==='loading')body.append(node('p','status','正在读取今日安排…'));
 else if(!(state.tasks||[]).length)body.append(node('p','status',state.error?'暂时无法读取待办':'今天没有待办安排'));
 else for(const t of state.tasks){const row=node('div','row'+(t.done?' done':'')),check=node('input');check.type='checkbox';check.checked=!!t.done;check.disabled=!!(t.pending||t.done);check.setAttribute('aria-label','完成'+t.title);check.onchange=()=>emit('complete',t.id);const title=button(t.title,'select',t.id,'');title.disabled=!!t.pending;row.append(check,title,node('small','',t.time||'待安排'));body.append(row)}
 if(state.error){body.append(node('p','error',state.error),button('刷新重试','retry'))}
 if(!state.selected){footer.append(icon(button('全部任务','all'),'up'));footer.append(state.review?Object.assign(button('待确认','review'),{id:'review'}):node('span','','课间'))}
 if(currentSelection===state.selected)body.scrollTop=scroll;else body.scrollTop=0;currentSelection=state.selected;
};
emit('ready');
</script></html>
